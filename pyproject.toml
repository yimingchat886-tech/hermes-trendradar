[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-benchmark"
version = "0.1.0"
description = "Hermes stock benchmark tracking CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-benchmark = "hermes_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_benchmark*"]
