[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-benchmark"
version = "0.1.0"
description = "Hermes stock benchmark tracking CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-benchmark = "hermes_benchmark.cli:main"
trendradar-media = "hermes_benchmark.media_jobs:main"

[tool.setuptools.packages.find]
include = ["hermes_benchmark*"]

[tool.setuptools.package-data]
"hermes_benchmark.collector_distribution" = ["README.md", "collector_config.template.yaml", "profile/config.template.yaml", "profile/env.guardrails.example", "profile/prefill/collector-prefill.json"]
"hermes_benchmark.collector_distribution.stock_runtime_plugin" = ["plugin.yaml"]
