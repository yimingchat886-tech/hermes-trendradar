name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e . pytest==9.1.1 ruff==0.15.20

      - name: Lint
        run: python -m ruff check --select E9,F63,F7,F82 hermes_benchmark tests .trellis/scripts

      - name: Typecheck
        run: python -m compileall -q hermes_benchmark tests .trellis/scripts

      - name: Test
        env:
          TMPDIR: /tmp
        run: python -m pytest -q
